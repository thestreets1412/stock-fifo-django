       <div class="action-row"><button data-template-id="save-button" type="submit" class="btn btn-primary canva-button" style="background: rgb(0, 240, 255); color: rgb(10, 14, 26);"> <span class="spinner" aria-hidden="true"></span> <i data-lucide="database-zap" aria-hidden="true"></i> <span data-template-id="save-button-label" class="button-label-default canva-text" style="color: rgb(10, 14, 26); font-weight: 700; font-style: normal; font-size: 14px; letter-spacing: 0.14rem;">Save</span> <span data-template-id="saving-button-label" class="button-label-loading canva-text" style="color: rgb(10, 14, 26); font-weight: 700; font-style: normal; font-size: 14px; letter-spacing: 0.1rem;">Processing</span> </button>
       </div>
       <div id="successStatus" class="status success" role="status" aria-live="polite"><i data-lucide="check-circle-2" aria-hidden="true"></i> <span data-template-id="success-message" class="canva-text" style="color: rgb(189, 250, 255); font-weight: 400; font-style: normal; font-size: 12px;">Lot validated. Connect this form to the Django endpoint to commit the purchase.</span>
       </div>
       <div id="errorStatus" class="status error" role="alert"><i data-lucide="triangle-alert" aria-hidden="true"></i> <span data-template-id="error-message" class="canva-text" style="color: rgb(255, 193, 223); font-weight: 400; font-style: normal; font-size: 12px;">Complete all required fields before saving this lot.</span>
       </div>
      </form>
     </div>
    </div>
   </main><button data-template-id="reopen-button" id="reopenButton" type="button" class="reopen-button canva-button" style="background: rgb(16, 24, 43); color: rgb(0, 240, 255); font-weight: 600; font-style: normal; font-size: 15px;">Reopen modal</button>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const modal = document.getElementById("lotModal");
      const backdrop = document.getElementById("modalBackdrop");
      const closeButton = document.querySelector(".btn-close");
      const reopenButton = document.getElementById("reopenButton");
      const form = document.getElementById("lotForm");
      const submitButton = form.querySelector('[type="submit"]');
      const evidenceInput = document.getElementById("id_evidence");
      const fileStatus = document.getElementById("fileStatus");
      const successStatus = document.getElementById("successStatus");
      const errorStatus = document.getElementById("errorStatus");
      let lastFocusedElement = null;
      let submitting = false;

      const focusableSelector = [
        "button:not([disabled])",
        "select:not([disabled])",
        "input:not([type='hidden']):not([disabled])",
        "[tabindex]:not([tabindex='-1'])"
      ].join(",");

      function hideStatuses() {
        successStatus.classList.remove("is-visible");
        errorStatus.classList.remove("is-visible");
      }

      function closeModal() {
        if (modal.hidden || submitting) return;
        lastFocusedElement = document.activeElement;
        modal.classList.add("is-closing");
        backdrop.style.opacity = "0";
        setTimeout(() => {
          modal.hidden = true;
          modal.classList.remove("is-closing");
          backdrop.hidden = true;
          reopenButton.classList.add("is-visible");
          reopenButton.focus();
        }, 300);
      }

      function openModal() {
        modal.hidden = false;
        backdrop.hidden = false;
        backdrop.style.opacity = "1";
        reopenButton.classList.remove("is-visible");
        hideStatuses();
        requestAnimationFrame(() => document.getElementById("id_symbol").focus());
      }

      closeButton.addEventListener("click", closeModal);
      reopenButton.addEventListener("click", openModal);

      backdrop.addEventListener("click", closeModal);

      evidenceInput.addEventListener("change", () => {
        fileStatus.textContent = evidenceInput.files.length
          ? evidenceInput.files[0].name
          : "";
      });

      form.addEventListener("input", () => {
        form.classList.remove("was-validated");
        errorStatus.classList.remove("is-visible");
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        hideStatuses();
        form.classList.add("was-validated");

        if (!form.checkValidity()) {
          errorStatus.classList.add("is-visible");
          const firstInvalid = form.querySelector(":invalid");
          if (firstInvalid) firstInvalid.focus();
          return;
        }

        submitting = true;
        submitButton.disabled = true;
        submitButton.classList.add("is-loading");
        form.querySelectorAll("input, select").forEach(control => {
          if (control.type !== "hidden") control.disabled = true;
        });

        setTimeout(() => {
          submitting = false;
          submitButton.disabled = false;
          submitButton.classList.remove("is-loading");
          form.querySelectorAll("input, select").forEach(control => {
            control.disabled = false;
          });
          successStatus.classList.add("is-visible");
          form.classList.remove("was-validated");
          lucide.createIcons();
        }, 850);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !modal.hidden) {
          closeModal();
          return;
        }

        if (event.key !== "Tab" || modal.hidden) return;

        const focusable = [...modal.querySelectorAll(focusableSelector)]
          .filter(element => element.offsetParent !== null);
        if (!focusable.length) return;

        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });
    });
  </script>
 
</body></html>
