<!-- @dsCard group="Colors" viewport="700x160" name="Alert Tones" subtitle="Bootstrap contextual colors for messages" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;font-family:var(--font-sans);background:var(--surface-page);">
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;"><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:8px;background:var(--info-500);border:1px solid rgba(0,0,0,.08);"></div><div style="font:12px/1.3 var(--font-mono, monospace);color:#495057;">Info<br>--info-500</div></div><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:8px;background:var(--success-500);border:1px solid rgba(0,0,0,.08);"></div><div style="font:12px/1.3 var(--font-mono, monospace);color:#495057;">Success<br>--success-500</div></div><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:8px;background:var(--warning-500);border:1px solid rgba(0,0,0,.08);"></div><div style="font:12px/1.3 var(--font-mono, monospace);color:#495057;">Warning<br>--warning-500</div></div><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:8px;background:var(--danger-500);border:1px solid rgba(0,0,0,.08);"></div><div style="font:12px/1.3 var(--font-mono, monospace);color:#495057;">Danger<br>--danger-500</div></div><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:8px;background:var(--secondary-500);border:1px solid rgba(0,0,0,.08);"></div><div style="font:12px/1.3 var(--font-mono, monospace);color:#495057;">Secondary<br>--secondary-500</div></div></div>
</body></html>
