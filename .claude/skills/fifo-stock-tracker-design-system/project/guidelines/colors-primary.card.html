<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;font-family:var(--font-sans);background:var(--surface-page);">
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;"><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:8px;background:var(--blue-500);border:1px solid rgba(0,0,0,.08);"></div><div style="font:12px/1.3 var(--font-mono, monospace);color:#495057;">Primary<br>--blue-500</div></div><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:8px;background:var(--blue-600);border:1px solid rgba(0,0,0,.08);"></div><div style="font:12px/1.3 var(--font-mono, monospace);color:#495057;">Primary hover<br>--blue-600</div></div><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:8px;background:var(--blue-700);border:1px solid rgba(0,0,0,.08);"></div><div style="font:12px/1.3 var(--font-mono, monospace);color:#495057;">Primary active<br>--blue-700</div></div></div>
</body></html>
