<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;font-family:var(--font-sans);background:var(--surface-page);">
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;"><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:8px;background:var(--green-700);border:1px solid var(--border-default);"></div><div style="font:12px/1.3 var(--font-mono, monospace);color:var(--text-muted);">Gain<br>--green-700</div></div><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:8px;background:var(--red-700);border:1px solid var(--border-default);"></div><div style="font:12px/1.3 var(--font-mono, monospace);color:var(--text-muted);">Loss<br>--red-700</div></div><div style="display:flex;flex-direction:column;gap:6px;"><div style="height:56px;border-radius:8px;background:var(--slate-800);border:1px solid var(--border-default);"></div><div style="font:12px/1.3 var(--font-mono, monospace);color:var(--text-muted);">Report header<br>--slate-800</div></div></div>
</body></html>
