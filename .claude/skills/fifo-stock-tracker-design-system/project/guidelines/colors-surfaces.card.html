<!-- @dsCard group="Colors" viewport="700x160" name="Surfaces & Navbar" subtitle="Page, card, and dark-navbar backgrounds" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;font-family:var(--font-sans);background:var(--surface-page);display:flex;gap:14px;">
<div style="flex:1;height:100px;border-radius:8px;background:var(--surface-card);border:1px solid var(--border-default);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-muted);">Card / Page</div>
<div style="flex:1;height:100px;border-radius:8px;background:var(--surface-navbar);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;">Navbar (dark)</div>
<div style="flex:1;height:100px;border-radius:8px;background:var(--surface-stripe);border:1px solid var(--border-default);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-muted);">Table stripe</div>
</body></html>
