<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Cards are flat; only modals/dropdowns get shadow" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;font-family:var(--font-sans);background:var(--surface-muted);display:flex;gap:20px;">
<div style="width:150px;height:90px;background:#fff;border:1px solid var(--border-default);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:12px;color:#6c757d;">Card: border only</div>
<div style="width:150px;height:90px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-modal);display:flex;align-items:center;justify-content:center;font-size:12px;color:#6c757d;">Modal shadow</div>
</body></html>
