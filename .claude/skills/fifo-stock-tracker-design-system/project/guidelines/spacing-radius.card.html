<!-- @dsCard group="Spacing" viewport="700x160" name="Corner Radii" subtitle="Buttons/inputs (sm), cards/modals (lg)" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;font-family:var(--font-sans);background:var(--surface-page);display:flex;gap:20px;align-items:center;">
<div style="width:70px;height:70px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:11px;color:#6c757d;">md 6px</div>
<div style="width:70px;height:70px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:11px;color:#6c757d;">lg 8px</div>
<div style="width:70px;height:70px;background:var(--blue-500);border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;">pill</div>
</body></html>
