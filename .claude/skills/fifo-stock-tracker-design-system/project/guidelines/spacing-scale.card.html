<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;font-family:var(--font-sans);background:var(--surface-page);">
<div style="display:flex;flex-direction:column;gap:10px;">
<div style="display:flex;align-items:center;gap:10px;"><div style="width:var(--space-1);height:16px;background:var(--blue-500);border-radius:3px;"></div><div style="font:12px var(--font-mono,monospace);color:#495057;">--space-1</div></div><div style="display:flex;align-items:center;gap:10px;"><div style="width:var(--space-2);height:16px;background:var(--blue-500);border-radius:3px;"></div><div style="font:12px var(--font-mono,monospace);color:#495057;">--space-2</div></div><div style="display:flex;align-items:center;gap:10px;"><div style="width:var(--space-3);height:16px;background:var(--blue-500);border-radius:3px;"></div><div style="font:12px var(--font-mono,monospace);color:#495057;">--space-3</div></div><div style="display:flex;align-items:center;gap:10px;"><div style="width:var(--space-4);height:16px;background:var(--blue-500);border-radius:3px;"></div><div style="font:12px var(--font-mono,monospace);color:#495057;">--space-4</div></div><div style="display:flex;align-items:center;gap:10px;"><div style="width:var(--space-5);height:16px;background:var(--blue-500);border-radius:3px;"></div><div style="font:12px var(--font-mono,monospace);color:#495057;">--space-5</div></div>
</div>
</body></html>
