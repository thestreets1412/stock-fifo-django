# Samba share for the home NAS folder.
#
# This file is pulled onto the Pi by `git pull` and wired in by a single
# `include =` line in /etc/samba/smb.conf, so the share definition stays
# version-controlled instead of being hand-edited on the Pi.
#
# `path` is the only thing separating this share from the FIFO ledger
# backups sitting in the sibling directory /mnt/backup/stock-fifo. The
# drive is exFAT, which stores no Unix permissions, so there is no
# filesystem-level backstop. Never point this at /mnt/backup itself.

[nas]
   comment = Shared documents
   path = /mnt/backup/nas
   browseable = yes
   read only = no
   guest ok = no
   valid users = nasuser

   # Only uid 1000 can write to the exFAT mount (uid=1000,dmask=0022),
   # so the smbd process must act as that user on disk. Without this,
   # nasuser writes are denied by the mount's permission mask.
   force user = minotaur
   force group = minotaur

   # create mask / directory mask are deliberately omitted: exFAT takes
   # its permission bits from the fstab fmask/dmask and ignores them.

   # Deleting over SMB is permanent and Explorer offers no undo. Move
   # deletions into .recycle instead; /etc/tmpfiles.d/nas-recycle.conf
   # empties anything older than 30 days.
   vfs objects = recycle
   recycle:repository = .recycle
   recycle:keeptree = yes
   recycle:versions = yes
   recycle:touch = yes
   recycle:exclude = *.tmp|~$*
