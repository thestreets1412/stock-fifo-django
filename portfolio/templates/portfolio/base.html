{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}FIFO Stock Tracker{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'lot_list' %}">Lots</a>
        <a href="{% url 'lot_create' %}">Record Buy</a>
        <a href="{% url 'sell_create' %}">Record Sell</a>
        {% if user.is_authenticated %}
            <span>Hi, {{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" style="display: inline;">
                {% csrf_token  %}
                <button type="submit">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </nav>
    <hr>
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
