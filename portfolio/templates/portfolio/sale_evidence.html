{% extends 'portfolio/base.html' %}
{% block title %}Sell Evidence{% endblock %}
{% block content %}
<h1 class="mb-4"><i class="bi bi-image me-2"></i>Evidence &mdash; {{ sale.symbol.ticker }} sale ({{ sale.sell_date }})</h1>
<div class="card mb-3" style="max-width: 600px;">
    {% if sale.evidence %}
        <img src="{{ sale.evidence.url }}" alt="Sell evidence" class="img-fluid card-img">
    {% else %}
        <div class="card-body">
            <p class="card-text text-muted mb-0">No evidence uploaded for this sale.</p>
        </div>
    {% endif %}
</div>
<a href="{% url 'sale_list' %}" class="btn btn-outline-secondary">Back to Sell History</a>
{% endblock %}
